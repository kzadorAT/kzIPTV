name: EPG AR

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playlist de referencia de iptv-org
        run: |
          mkdir -p fixtures
          curl -fsSL https://iptv-org.github.io/iptv/countries/ar.m3u -o fixtures/ar.m3u

      - name: Indice de canales de mi.tv (mismo origen que los tvg-id de iptv-org)
        run: git clone --depth 1 https://github.com/iptv-org/epg.git .epg

      - name: Instalar dependencias del pipeline
        run: npm install --prefix tools/epg --no-audit --no-fund

      - name: Generar la guia AR (XMLTV recortado a la playlist)
        run: |
          node tools/epg/scripts/fetch-mitv-epg.mjs \
            --playlist fixtures/ar.m3u \
            --channels-index .epg/sites/mi.tv \
            --out epg/ar.xml.gz \
            --days 2 \
            --concurrency 4

      - name: Publicar
        run: |
          git config user.name "kzIPTV bot"
          git config user.email "bot@kziptv.local"
          git add epg/ar.xml.gz epg/report.json
          git diff --staged --quiet || git commit -m "chore(epg): actualizar guia AR"
          git push
